[package]
name = "dircmp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A TUI tool for comparing folder contents"
license = "MIT"
authors = ["Michal Chwirut"]

[[bin]]
name = "dircmp"
path = "src/main.rs"

[lib]
name = "dircmp"
path = "src/lib.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "1"
blake3 = "1"
walkdir = "2"
anyhow = "1"
rayon = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
tempfile = "3"
