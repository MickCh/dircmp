[package]
name = "dircmp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A TUI tool for comparing folder contents"
license = "MIT"
authors = ["Michal Chwirut", "Claude Code"]

[[bin]]
name = "dircmp"
path = "src/main.rs"

[lib]
name = "dircmp"
path = "src/lib.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
blake3 = "1"
walkdir = "2"
anyhow = "1"
rayon = "1"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
tempfile = "3"
